version: '3.8'
services:
  proto-main:
    build: .
    container_name: proto-main
    restart: unless-stopped
    ports:
      - "6767:6767"
      - "6868:6868"
    environment:
      - NODE_ENV=production
      - PORT=6767
      - ENABLE_DOCKER=true
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - PROTO_HOST_DATA_PATH=${PWD}/.data
      - PROTO_OWNER_USER=${PROTO_OWNER_USER:-}
      - PROTO_OWNER_PASS=${PROTO_OWNER_PASS:-}
    volumes:
      - ./.data:/app/.data
      - ./backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock

  proto-admin:
    build: .
    container_name: proto-admin
    restart: unless-stopped
    command: npm run dev
    ports:
      - "3000:3000"
      - "6869:6869"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - ENABLE_DOCKER=true
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - PROTO_HOST_DATA_PATH=${PWD}/.data
      - PROTO_OWNER_USER=${PROTO_OWNER_USER:-}
      - PROTO_OWNER_PASS=${PROTO_OWNER_PASS:-}
    volumes:
      - ./.data:/app/.data
      - ./backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock
